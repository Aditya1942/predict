# Team aliases. Keys are matched case-, accent- and punctuation-insensitively.
#
# [user]: what people type -> canonical football-data.org team name(s).
#   One entry resolves directly; several make the alias ambiguous and the CLI asks which one.
# [source.<name>]: a data source's own team name -> canonical football-data.org team name.
#   Only for names the fuzzy matcher cannot get right on its own.
#   [source.football_data_couk] is different: it maps football-data.co.uk names to Understat names
#   (backtest only).
#
# Canonical names are written from memory of the football-data.org naming convention and have not
# been checked against a live dump of all 6 Competitions yet.

[user]
barca = ["FC Barcelona"]
inter = ["FC Internazionale Milano"]
"inter milan" = ["FC Internazionale Milano"]
psg = ["Paris Saint-Germain FC"]
"man city" = ["Manchester City FC"]
"man utd" = ["Manchester United FC"]
"man united" = ["Manchester United FC"]
spurs = ["Tottenham Hotspur FC"]
atleti = ["Club Atlético de Madrid"]
atletico = ["Club Atlético de Madrid"]
bayern = ["FC Bayern München"]
leverkusen = ["Bayer 04 Leverkusen"]
juve = ["Juventus FC"]
real = ["Real Madrid CF", "Real Betis Balompié", "Real Sociedad de Fútbol"]
milan = ["AC Milan", "FC Internazionale Milano"]

